<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#F5F7F2"/>
  <!-- Quick Look renders square; content sits in the centre band that sips crops to 1200x630. -->
  <g transform="translate(0,285)">
  <line x1="80" y1="150" x2="1120" y2="150" stroke="#D5DCD2" stroke-width="2"/>
  <text x="80" y="112" font-family="Georgia, serif" font-size="40" font-weight="600" fill="#12261E">Harsh Yadav</text>
  <text x="1120" y="112" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#48584F">AI engineer</text>
  <text x="80" y="290" font-family="Georgia, serif" font-size="74" font-weight="600" fill="#12261E">I make LLM agents</text>
  <text x="80" y="390" font-family="Georgia, serif" font-size="74" font-weight="600" fill="#12261E">dependable in production.</text>
  <rect x="76" y="470" width="430" height="56" rx="6" fill="#C9F26C"/>
  <text x="96" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#12261E">Don't read my CV. Run it.</text>
  <text x="1120" y="508" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#48584F">Eight runnable demos</text>
  </g>
